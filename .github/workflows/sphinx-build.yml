name: Sphinx Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v7
      with:
        # Number of commits to fetch. 0 indicates all history for all branches and tags.
        fetch-depth: '0'

    - name: Install packages
      run: |
        sudo apt update
        sudo apt upgrade -y
        sudo apt install -y git make python3-pip

    - name: Install Sphinx packages
      run: pip install -r requirements.txt

    - name: Build docs using Sphinx
      run: |
        make clean
        make html

    # Publish built docs to gh-pages branch.
    # ===============================
    - name: Commit documentation changes
      run: |
        rm -rf docs # not sure if this is needed...
        mkdir docs
        cp -rf build/* docs/
        cd docs
        cp -rf ./main/* ./ # Fix old links which don't specify main subdir
        echo "docs.amdc.dev" > CNAME
        touch .nojekyll # need this due to "_*" dirs getting ignored by GitHub
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add .
        git commit -m "Update documentation" -a || true
        # The above command will fail if no changes were present, so we ignore that.
    - name: Push documentation changes
      run: |
         git push origin HEAD:gh-pages # push to remote branch
    # ===============================

